[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dftlab-platform"
version = "0.1.0.dev0"
description = "DFT Lab platform installation skeleton; no scientific execution yet"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = []

[project.scripts]
dftlab-platform = "dftlab_platform.launcher:main"

[dependency-groups]
dev = ["hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dftlab_platform"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml", "uv.lock", "README.md"]

[tool.uv]
required-version = "==0.11.14"

