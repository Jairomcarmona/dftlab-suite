[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dftlab-platform"
version = "0.1.0.dev0"
description = "DFT Lab platform installation skeleton; no scientific execution yet"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "fastapi==0.143.0",
    "jsonschema[format-nongpl]==4.26.0",
    "rfc8785==0.1.4",
    "uvicorn==0.54.0",
]

[project.scripts]
dftlab-platform = "dftlab_platform.launcher:main"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "openapi-spec-validator==0.7.2",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dftlab_platform"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml", "uv.lock", "README.md", "hatch_build.py"]

[tool.uv]
required-version = "==0.11.14"

