name: Platform package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    name: Platform installed wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.14'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - name: Build both frontend targets and install pinned browser
        working-directory: app
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Install pinned Python and locked build dependencies
        run: |
          uv python install 3.12.10
          uv sync --project platform --locked --python 3.12.10
      - name: Build and qualify an installed wheel outside the checkout
        run: uv run --project platform --locked python -X utf8 deployment/local/qualify_platform.py
        env:
          REQUIRE_OPERATIVE_BROWSER: '1'
      - name: Validate authoritative schemas, fixtures and OpenAPI
        run: uv run --project platform --locked python -X utf8 contracts/scripts/validate_fixtures.py
      - name: Check source preservation
        run: git diff --exit-code
      - name: Store artifacts and qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-package-${{ matrix.os }}
          path: runtime/platform-qualification/
          if-no-files-found: error
          retention-days: 14
